[package]
name = "erlbrew-bot"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "erlbrew-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
regex = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
strsim = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
