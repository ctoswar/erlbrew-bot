      - closing
      - opening
      - location
      - address
      - nasaan
      - saan
      - map
      - maplink
      - landmark
    answer: |
      ⏰ Open po kami daily, 8:00 AM – 9:00 PM.
      🗺️ Location & directions po dito — kita ninyo na nang buo:
      https://maps.app.goo.gl/vXVz1TLBYA8KuNy79
      Kitakits po sa Erlbrew Café, Kawit, Cavite! Salamat po! ☕
    quick_replies:
      - title: Menu
        payload: MENU
      - title: Promo
        payload: PROMO
      - title: Events
        payload: EVENTS

  - id: location
    payloads: [LOCATION]
    keywords:
