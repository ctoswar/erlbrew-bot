# Erlbrew Café — static bot content (friendly Taglish).
# EDIT THIS FILE ANYTIME — the bot re-reads it automatically (no restart needed).
# Replace every [PLACEHOLDER: ...] before going live.
# Payload names are referenced by the persistent menu, ice breakers and quick
# replies configured in setup_profile.py (do not rename them casually).

entries:
  - id: get_started
    payloads: [GET_STARTED]
    answer: |
      [PLACEHOLDER: WELCOME MESSAGE — i-adjust ang tone kung gusto nyo]
      Hi! Welcome po sa Erlbrew Café sa Kawit, Cavite! ☕
      Ako po si Erl, ang chat assistant namin. I-type lang po ang tanong nyo,
      o piliin po ang isa sa mga buttons sa baba. Salamat po! 😊
    quick_replies:
      - title: Menu
        payload: MENU
      - title: Hours & Location
        payload: HOURS
      - title: Promo
        payload: PROMO
      - title: Events
        payload: EVENTS

  - id: menu
    payloads: [MENU]
    keywords:
      - menu
      - price
      - prices
      - presyo
      - magkano
      - kape
      - coffee
      - drinks
      - inumin
      - food
      - pagkain
      - order
    answer: |
      Eto po ang aming menu ☕
      📋 Ito po ang latest menu at presyo namin:
      https://erlbrew.codigital.services/
    quick_replies:
      - title: Hours & Location
        payload: HOURS
      - title: Promo
        payload: PROMO
      - title: Events
        payload: EVENTS

  - id: hours
    payloads: [HOURS]
